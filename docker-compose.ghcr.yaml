# OpenClaw - Coolify Deployment using pre-built GHCR images
# https://github.com/Kry9toN/openclaw-coolify
#
# This compose pulls ready-made images built by the GitHub Action
# (.github/workflows/docker-build.yml) instead of building on the server.
# Much faster and lighter on the Coolify host — no pnpm build at deploy time.
#
# Quick Start (Coolify):
# 1. Create New Resource -> Public Repository -> this repo
# 2. Build Pack: Docker Compose
#    - Docker Compose Location: docker-compose.ghcr.yaml
# 3. Set environment variables (see below) and Deploy
#
# NOTE: the ghcr.io images must be public, OR add a GHCR registry
# credential in Coolify (Settings -> Registries) so it can pull them.

services:
  # =============================================================================
  # OPENCLAW GATEWAY - Main AI Assistant Service
  # =============================================================================
  openclaw-gateway:
    image: ghcr.io/kry9ton/openclaw-gateway:${OPENCLAW_VERSION:-latest}
    container_name: openclaw-gateway
    restart: unless-stopped

    environment:
      # === Core Settings ===
      - NODE_ENV=production
      - HOME=/data
      - TERM=xterm-256color
      # Keep gateway restarts in-process (prevents Coolify crash-loop)
      - OPENCLAW_NO_RESPAWN=1

      # === Auto Public URL (Coolify magic env) ===
      # Coolify assigns a domain to this service:port and injects it back as
      # SERVICE_URL_OPENCLAWGATEWAY, which the entrypoint uses for device pairing.
      - SERVICE_FQDN_OPENCLAWGATEWAY_18789

      # === Gateway Configuration ===
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      # Auto-generated & persisted by Coolify (SERVICE_PASSWORD_* magic env).
      # Leave unset to let Coolify generate one; or set OPENCLAW_GATEWAY_TOKEN
      # yourself to override.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-$SERVICE_PASSWORD_64_OPENCLAWGATEWAY}
      # Optional: override the public URL used for pairing links/QRs
      - OPENCLAW_PUBLIC_URL=${OPENCLAW_PUBLIC_URL:-}
      # Optional: extra Control UI browser origins (comma-separated). The public
      # URL is whitelisted automatically; add more here if you use other domains.
      - OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS=${OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS:-}

      # === Data Paths ===
      - OPENCLAW_CONFIG_PATH=/data/.openclaw/openclaw.json
      - OPENCLAW_STATE_DIR=/data/.openclaw
      - XDG_CONFIG_HOME=/data/.openclaw

      # === Model Selection ===
      # Override the auto-detected primary model, e.g. openai/gpt-4o-mini
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL:-}

      # === Model Authentication (set at least one) ===
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Custom OpenAI-compatible endpoint (self-hosted router/proxy)
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

      # === Channels ===
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}

      # === Browser Integration ===
      - OPENCLAW_BROWSER_ENABLED=${OPENCLAW_BROWSER_ENABLED:-true}
      - OPENCLAW_BROWSER_URL=http://openclaw-browser:9222

      # === Redis Cache ===
      - REDIS_URL=${REDIS_URL:-redis://openclaw-redis:6379}

      # === Optional Integrations ===
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}

    volumes:
      - openclaw-config:/data/.openclaw
      - openclaw-workspace:/data/openclaw

    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_CANVAS_PORT:-18793}:18793"

    depends_on:
      openclaw-redis:
        condition: service_healthy
      openclaw-browser:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - openclaw-network

  # =============================================================================
  # REDIS - Cache and Session Storage
  # =============================================================================
  openclaw-redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - openclaw-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - openclaw-network

  # =============================================================================
  # BROWSER - Headless Chrome (CDP) for Browser Automation Tool
  # Uses chromedp/headless-shell: a minimal, container-hardened Chrome that
  # only exposes CDP on 9222. Avoids the fragile Xvfb/VNC full-Chromium setup
  # that crash-loops with SIGTRAP.
  # =============================================================================
  openclaw-browser:
    image: chromedp/headless-shell:latest
    container_name: openclaw-browser
    restart: unless-stopped

    # Shared memory for Chrome (prevents renderer crashes)
    shm_size: 2gb

    command:
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage

    networks:
      - openclaw-network

volumes:
  openclaw-config:
    name: openclaw-config
  openclaw-workspace:
    name: openclaw-workspace
  openclaw-redis-data:
    name: openclaw-redis-data

networks:
  openclaw-network:
    driver: bridge
